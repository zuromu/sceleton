[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "scele-cli"
version = "0.1.0"
description = "SCeLE (Fasilkom UI's Moodle) in your terminal: deadlines, materials, announcements, grades"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["requests>=2.28", "rich>=13"]

[project.scripts]
scele = "scele:main"

[tool.setuptools]
py-modules = ["scele"]
